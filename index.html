function loadMerchants() {
  let saved = [];
  try {
    const raw = localStorage.getItem("merchants");
    saved = raw ? JSON.parse(raw) : [];
  } catch {
    saved = [];
  }
  // merge in built-in merchant list (saved entries win)
  const byMid = {};
  SEED_MERCHANTS.forEach((m) => (byMid[m.mid] = m));
  saved.forEach((m) => (byMid[m.mid] = { ...byMid[m.mid], ...m }));
  return Object.values(byMid);
}
function loadHistory() {
  try {
    const raw = localStorage.getItem("ticketHistory");
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}
function saveHistory(list) {
  try {
    localStorage.setItem("ticketHistory", JSON.stringify(list));
  } catch (e) {
    console.error("history save failed", e);
  }
}
function saveMerchants(list) {
  try {
    localStorage.setItem("merchants", JSON.stringify(list));
  } catch (e) {
    console.error("save failed", e);
  }
}

// ---------- email builder ----------
function buildEmail(mList, opts) {
  const {
    ticketType,
    machine,
    mode,
    extraNotes,
    integrationDay,
    integrationSlot,
    qty,
    plan,
    customVisa,
    customDebit,
    customAmex,
    earnRate,
    refundAmount,
    refundLimit,
  } = opts;
  const m = mList[0];
  const multi = mList.length > 1;
  const isIntegrated = mode === "Integrated";
  const n = qty || 1;

  const subjectWho = multi
    ? `${
        mList.length <= 4 ? mList.map((x) => x.mid).join(", ") : "Multiple MIDs"
      } & ${m.name} (${mList.length} sites)`
    : `${m.mid} & ${m.name}`;

  let subject = "";
  const lines = [];
  lines.push("Hi Team,");
  lines.push("");

  if (ticketType === "Machine allocation") {
    subject = `${subjectWho} - ${n > 1 ? n + " x " : ""}${machine} terminal allocation`;
    const machinePhrase = n > 1 ? `${n} x ${machine} terminals` : `a ${machine}`;
    const modePhrase =
      machine === "DX8000"
        ? "Standalone Mode"
        : machine === "P400"
        ? "Integrated"
        : mode;
    if (multi) {
      lines.push(
        `Merchant requests to allocate ${machinePhrase} to each of the following ${mList.length} sites. ( ${modePhrase} )`
      );
      lines.push("");
      mList.forEach((x, i) => {
        lines.push(
          `${i + 1}. ${x.name} — MID ${x.mid}${
            x.sevenDay ? " ( 7 day settlement )" : ""
          }`
        );
        lines.push(`Trading Address: ${x.address}`);
        lines.push("");
      });
      if (mList.some((x) => x.sevenDay)) {
        lines.push("For the sites on 7 day settlement:");
        lines.push("7 Day Settlement");
        lines.push("Extended Settlement Enabled");
        lines.push("Split Payment Enabled");
        lines.push("");
      }
      lines.push("MCR Enabled");
      lines.push("Full Surcharge Enabled");
      lines.push("$0 Rental Charge");
    } else {
      lines.push(
        `Merchant requests to allocate ${machinePhrase} to his site. ( ${modePhrase} )`
      );
      lines.push("");
      if (m.sevenDay) {
        lines.push("7 Day Settlement");
        lines.push("Extended Settlement Enabled");
        lines.push("Split Payment Enabled");
        lines.push("");
      }
      lines.push("MCR Enabled");
      lines.push("Full Surcharge Enabled");
      lines.push("$0 Rental Charge");
      lines.push("");
      lines.push(`Trading Address: ${m.address}`);
    }
    if (isIntegrated) {
      lines.push("");
      lines.push(`Integration (${m.integrationType || "[cloud or on prem]"}) with ${m.posName || "[POS name]"}`);
      lines.push(`Best Contact for integration: ${m.contact || "[contact]"}`);
      if (integrationDay || integrationSlot) {
        lines.push(
          `Requested integration booking: ${integrationDay || "[day]"}${
            integrationSlot ? `, ${integrationSlot}` : ""
          }`
        );
      }
    }
  } else if (ticketType === "Change rates") {
    subject = `${subjectWho} - Rate change request`;
    const pct = (v) => (v ? String(v).replace("%", "").trim() : "[ % ]");
    if (multi) {
      lines.push(
        `Merchant requests to change the rates across the following ${mList.length} accounts:`
      );
      lines.push("");
      mList.forEach((x, i) => {
        lines.push(`${i + 1}. ${x.name} — MID ${x.mid}`);
      });
    } else {
      lines.push(`Merchant requests to change the rates on his account.`);
    }
    lines.push("");
    let earnValue;
    if (plan === "Black Plan") {
      lines.push("New Plan: Black Plan");
      lines.push("2.49% Visa, MasterCard, Debit & AMEX");
      earnValue = "1";
    } else if (plan === "Gold Plan") {
      lines.push("New Plan: Gold Plan");
      lines.push("1.89% Visa, MasterCard & Debit");
      lines.push("2.1% AMEX");
      earnValue = "2";
    } else {
      lines.push("New Plan: Custom Rate");
      lines.push(`${pct(customVisa)}% Visa & MasterCard`);
      lines.push(`${pct(customDebit)}% Debit`);
      lines.push(`${pct(customAmex)}% AMEX`);
      earnValue = earnRate ? String(earnRate).replace("$", "").trim() : "[ amount ]";
    }
    lines.push("");
    lines.push("Full Surcharge Enabled");
    lines.push("");
    lines.push(
      `Earn Rate: 1 Qantas Point for every $${earnValue} the merchant earns`
    );
  } else if (ticketType === "Order paper rolls") {
    subject = `${subjectWho} - Paper roll order`;
    if (multi) {
      lines.push(
        `Merchant requests x${n} pack${
          n > 1 ? "s" : ""
        } of paper rolls to be sent to each of the following sites:`
      );
      lines.push("");
      mList.forEach((x, i) => {
        lines.push(`${i + 1}. ${x.name} — MID ${x.mid}`);
        lines.push(`Trading Address: ${x.address}`);
        lines.push("");
      });
      while (lines[lines.length - 1] === "") lines.pop();
    } else {
      lines.push(
        `Merchant requests x${n} pack${
          n > 1 ? "s" : ""
        } of paper rolls to be sent to his site.`
      );
      lines.push("");
      lines.push(`Trading Address: ${m.address}`);
    }
  } else if (ticketType === "Enable MOTO") {
    subject = `${subjectWho} - MOTO enablement`;
    if (multi) {
      lines.push(
        `Merchant requests to enable MOTO on all machines on Phoenix across the following ${mList.length} accounts:`
      );
      lines.push("");
      mList.forEach((x, i) => {
        lines.push(`${i + 1}. ${x.name} — MID ${x.mid}`);
      });
    } else {
      lines.push(
        `Merchant requests to enable MOTO on all machines on Phoenix on his account.`
      );
    }
    lines.push("");
    lines.push("Please provide the MOTO password.");
  } else if (ticketType === "Enable refunds") {
    subject = `${subjectWho} - Refund enablement`;
    const money = (v) =>
      v ? String(v).replace("$", "").trim() : "[ amount ]";
    if (multi) {
      lines.push(
        `Merchant requests to enable refunds on all machines on Phoenix across the following ${mList.length} accounts:`
      );
      lines.push("");
      mList.forEach((x, i) => {
        lines.push(`${i + 1}. ${x.name} — MID ${x.mid}`);
      });
    } else {
      lines.push(
        `Merchant requests to enable refunds on all machines on Phoenix on his account.`
      );
    }
    lines.push("");
    lines.push(`Refund Amount: $${money(refundAmount)}`);
    lines.push(`Refund Limit Per Day: $${money(refundLimit)}`);
  }

  if (extraNotes.trim()) {
    lines.push("");
    lines.push(extraNotes.trim());
  }
  lines.push("");
  lines.push("Thank you team.");

  return { subject, body: lines.join("\n") };
}

const inputStyle = {

function Pills({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
      {options.map((o) => (
        <button
          key={o}
          onClick={() => onChange(o)}
          style={{
            padding: "10px 16px",
            borderRadius: 999,
            border: `1px solid ${value === o ? S.accent : S.line}`,
            background: value === o ? "rgba(79,77,220,0.10)" : S.panel2,

            fontSize: 14,
            fontWeight: value === o ? 700 : 400,
            cursor: "pointer",
          }}
        >
          {o}
        </button>
      ))}
    </div>
  );
}

function Stepper({ value, onChange, min = 1, max = 20 }) {
  const btn = {
    width: 44,
    height: 44,
    borderRadius: 10,
    border: `1px solid ${S.line}`,
    background: S.panel2,
    color: S.ink,
    fontSize: 22,
    cursor: "pointer",
  };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
      <button onClick={() => onChange(Math.max(min, value - 1))} style={btn}>
        −
      </button>
      <input
        value={value}
        onChange={(e) => {
          const v = parseInt(e.target.value.replace(/\D/g, ""), 10);
          onChange(isNaN(v) ? min : Math.min(max, Math.max(min, v)));
        }}
        inputMode="numeric"
        style={{
          fontSize: 20,
          fontWeight: 800,
          width: 64,
          textAlign: "center",
          background: "transparent",
          border: "none",
          borderBottom: `2px solid ${S.line}`,
          color: S.ink,
          outline: "none",
          padding: "4px 0",
        }}
      />
      <button onClick={() => onChange(Math.min(max, value + 1))} style={btn}>
        +
      </button>
    </div>
  );
}

function App() {
  const [merchants, setMerchants] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("ticket");
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [search, setSearch] = useState("");

  const [selectedIds, setSelectedIds] = useState([]);
  const [merchantQuery, setMerchantQuery] = useState("");
  const [ticketType, setTicketType] = useState("Machine allocation");
  const [plan, setPlan] = useState("Black Plan");
  const [customVisa, setCustomVisa] = useState("");
  const [customDebit, setCustomDebit] = useState("");
  const [customAmex, setCustomAmex] = useState("");
  const [earnRate, setEarnRate] = useState("");
  const [refundAmount, setRefundAmount] = useState("");
  const [refundLimit, setRefundLimit] = useState("");
  const [machine, setMachine] = useState("DX8000");
  const [qty, setQty] = useState(1);
  const [mode, setMode] = useState("Standalone Mode");

  const applyMerchantDefaults = (m) => {
    if (!m) return;
    const dm = m.defaultMachine || "DX8000";
    setMachine(dm);
    setMode(dm === "P400" ? "Integrated" : "Standalone Mode");
    setQty(1);
  };

  const toggleMerchant = (id) => {
    const already = selectedIds.includes(id);
    const next = already
      ? selectedIds.filter((x) => x !== id)
      : [...selectedIds, id];
    setSelectedIds(next);
    if (!already && next.length === 1) {
      applyMerchantDefaults(merchants.find((x) => x.id === id));
    }
  };
  const [integrationDay, setIntegrationDay] = useState("");
  const [integrationSlot, setIntegrationSlot] = useState("");
  const [extraNotes, setExtraNotes] = useState("");
  const [copied, setCopied] = useState("");
  const [history, setHistory] = useState([]);
  const [expandedId, setExpandedId] = useState(null);
  const [confirmDeleteTicket, setConfirmDeleteTicket] = useState(null);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");

  useEffect(() => {
    setMerchants(loadMerchants());
    setHistory(loadHistory());
    setLoaded(true);
  }, []);

  const persist = (list) => {
    setMerchants(list);
    saveMerchants(list);
  };

  const selectedMerchants = selectedIds
    .map((id) => merchants.find((x) => x.id === id))
    .filter(Boolean);
  const selected = selectedMerchants[0] || null;
  const mq = merchantQuery.trim().toLowerCase();
  const merchantResults = mq
    ? merchants
        .filter(
          (x) =>
            !selectedIds.includes(x.id) &&
            (x.name.toLowerCase().includes(mq) ||
              x.mid.toLowerCase().includes(mq))
        )
        .slice(0, 8)
    : [];
  const effectiveMode =
    machine === "DX8000"
      ? "Standalone Mode"
      : machine === "P400"
      ? "Integrated"
      : mode;
  const email = selectedMerchants.length
    ? buildEmail(selectedMerchants, {
        ticketType,
        machine,
        mode: effectiveMode,
        extraNotes,
        integrationDay,
        integrationSlot,
        qty,
        plan,
        customVisa,
        customDebit,
        customAmex,
        earnRate,
        refundAmount,
        refundLimit,
      })
    : null;

  const alreadyProcessed = email
    ? history.some(
        (t) => t.subject === email.subject && t.body === email.body
      )
    : false;

  const copy = async (text, which) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    setCopied(which);
    setTimeout(() => setCopied(""), 1600);
  };

  const logTicket = () => {
    if (!email) return;
    if (
      history.some(
        (t) => t.subject === email.subject && t.body === email.body
      )
    )
      return;
    const entry = {
      id: Date.now().toString(36),
      at: new Date().toISOString(),
      type: ticketType,
      subject: email.subject,
      body: email.body,
    };
    const list = [entry, ...history];
    setHistory(list);
    saveHistory(list);
  };

  const deleteTicket = (id) => {
    const list = history.filter((x) => x.id !== id);
    setHistory(list);
    saveHistory(list);
    setConfirmDeleteTicket(null);
  };

  const importBackup = (rawText) => {
    try {
      const source = typeof rawText === "string" ? rawText : importText;
      // fix smart quotes from Notes/Mail and trim
      let txt = source
        .replace(/[\u201C\u201D\u201E\u2033]/g, '"')
        .replace(/[\u2018\u2019\u2032]/g, "'")
        .trim();
      // if multiple backups got pasted together, take the first complete one
      const start = txt.indexOf("{");
      if (start === -1) throw new Error("no json");
      let depth = 0;
      let end = -1;
      let inStr = false;
      let esc = false;
      for (let i = start; i < txt.length; i++) {
        const c = txt[i];
        if (esc) { esc = false; continue; }
        if (c === "\\") { esc = true; continue; }
        if (c === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (c === "{") depth++;
        else if (c === "}") {
          depth--;
          if (depth === 0) { end = i + 1; break; }
        }
      }
      if (end === -1) throw new Error("incomplete");
      const data = JSON.parse(txt.slice(start, end));
      let inc = Array.isArray(data.merchants) ? data.merchants : [];
      if (inc.length === 0) {
        // maybe a second, non-empty backup follows — try it
        const rest = txt.slice(end);
        const s2 = rest.indexOf("{");
        if (s2 !== -1) {
          try {
            const d2 = JSON.parse(rest.slice(s2));
            if (Array.isArray(d2.merchants) && d2.merchants.length) inc = d2.merchants;
          } catch (e2) {}
        }
      }
      const byMid = {};
      merchants.forEach((x) => (byMid[x.mid] = x));
      let added = 0;
      let updated = 0;
      inc.forEach((x) => {
        if (!x || !x.mid) return;
        if (byMid[x.mid]) {
          byMid[x.mid] = { ...byMid[x.mid], ...x, id: byMid[x.mid].id };
          updated++;
        } else {
          byMid[x.mid] = {
            ...x,
            id:
              x.id ||
              Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          };
          added++;
        }
      });
      persist(Object.values(byMid));
      let histNote = "";
      if (Array.isArray(data.history) && data.history.length) {
        const ids = new Set(history.map((t) => t.id));
        const extra = data.history.filter((t) => t && t.id && !ids.has(t.id));
        if (extra.length) {
          const mergedH = [...extra, ...history].sort((a, b) =>
            (b.at || "").localeCompare(a.at || "")
          );
          setHistory(mergedH);
          saveHistory(mergedH);
          histNote = ` ${extra.length} history entries added.`;
        }
      }
      setImportMsg(`Imported: ${added} new, ${updated} updated.` + histNote);
      setImportText("");
    } catch {
      setImportMsg(
        "Couldn't read that backup — make sure you pasted the full text."
      );
    }
  };

  const filtered = merchants.filter(
    (m) =>
      m.name.toLowerCase().includes(search.toLowerCase()) ||
      m.mid.includes(search)
  );

  const tabBtn = (id, label) => (
    <button
      onClick={() => {
        setTab(id);
        setEditing(null);
      }}
      style={{
        flex: 1,
        padding: "12px 0",
        border: "none",
        background: "none",

        cursor: "pointer",
      }}

      {label}
    </button>

  return (
    <div
      style={{
        minHeight: "100vh",
        background: S.bg,
        color: S.ink,
        fontFamily:
          "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
      }}
    >
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "0 16px 60px" }}>
        <div
          style={{
            padding: "22px 0 10px",
            display: "flex",
            alignItems: "center",
            gap: 14,
          }}
        >
          <svg width="46" height="46" viewBox="0 0 100 100" aria-hidden="true">
            <rect x="8" y="8" width="24" height="84" rx="10" fill="#4F4DDC" />
            <rect x="8" y="68" width="58" height="24" rx="10" fill="#4F4DDC" />
            <rect x="38" y="8" width="21" height="21" rx="6" fill="#FF9A0C" />
            <rect x="66" y="8" width="26" height="46" rx="10" fill="#14ADCD" />
            <rect x="38" y="34" width="42" height="20" rx="9" fill="#14ADCD" />
            <rect x="66" y="62" width="21" height="21" rx="6" fill="#FF5139" />
          </svg>
          <div>
            <div
              style={{
                fontSize: 11,
                letterSpacing: "0.14em",
                textTransform: "uppercase",
                color: S.accentSoft,
                fontWeight: 700,
              }}

              Live Payments
            </div>
            <h1 style={{ fontSize: 24, fontWeight: 800, margin: "2px 0 0" }}>
              Ticket Builder
            </h1>
          </div>
        </div>

        <div
          style={{
            display: "flex",
            borderBottom: `1px solid ${S.line}`,
            marginBottom: 20,
          }}

          {tabBtn("ticket", "New ticket")}

        {!loaded && <div style={{ color: S.dim }}>Loading…</div>}

        {loaded && tab === "merchants" && (

            {editing ? (

                  border: `1px solid ${S.line}`,
                  borderRadius: 14,

                {merchants.length > 3 && (

                    style={{
                      color: S.dim,
                      textAlign: "center",
                      padding: "40px 20px",
                      lineHeight: 1.5,
                    }}
                  >
                    No merchants yet. Add your first merchant and their details
                    will be saved here for every future ticket.
                  </div>
                )}
                {filtered.map((m) => (
                  <div
                    key={m.id}
                    style={{
                      background: S.panel,
                      border: `1px solid ${S.line}`,
                      borderRadius: 14,
                      padding: "14px 16px",
                      marginBottom: 10,
                    }}
                  >
                    <div
                      style={{
                        display: "flex",
                        justifyContent: "space-between",
                        alignItems: "baseline",
                        gap: 8,
                      }}
                    >
                      <div style={{ fontWeight: 700, fontSize: 16 }}>{m.name}</div>
                      <div style={{ fontSize: 13, color: S.dim }}>MID {m.mid}</div>
                    </div>
                    <div style={{ fontSize: 13, color: S.dim, margin: "4px 0 10px" }}>
                      {m.address || "No address saved"}
                    </div>
                    <div
                      style={{
                        display: "flex",
                        gap: 6,
                        flexWrap: "wrap",
                        marginBottom: 12,
                      }}
                    >
                      <span style={tagStyle(m.sevenDay ? S.green : S.dim)}>
                        {m.sevenDay ? "7 day settlement" : "Standard settlement"}
                      </span>
                      <span style={tagStyle(m.integrated ? S.accent : S.dim)}>
                        {m.integrated
                          ? m.posName
                            ? `Has integration · ${m.posName}`
                            : "Has integration"
                          : "Standalone"}
                      </span>
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button
                        onClick={() => {
                          setSelectedIds([m.id]);
                          applyMerchantDefaults(m);
                          setTab("ticket");
                        }}
                        style={smallBtn(S.accent, true)}
                      >
                        New ticket
                      </button>
                      <button onClick={() => setEditing({ ...m })} style={smallBtn(S.line)}>
                        Edit
                      </button>
                      {confirmDelete === m.id ? (
                        <button
                          onClick={() => {
                            persist(merchants.filter((x) => x.id !== m.id));
                            setConfirmDelete(null);
                          }}
                          style={smallBtn(S.danger, true)}
                        >
                          Confirm delete
                        </button>
                      ) : (
                        <button
                          onClick={() => setConfirmDelete(m.id)}
                          style={smallBtn(S.line)}
                        >
                          Delete
                        </button>
                      )}
                    </div>
                  </div>
                ))}
                <div
                  style={{
                    borderTop: `1px solid ${S.line}`,
                    marginTop: 20,
                    paddingTop: 16,
                  }}
                >
                  <div
                    style={{
                      fontSize: 11,
                      letterSpacing: "0.08em",
                      textTransform: "uppercase",
                      color: S.dim,
                      fontWeight: 600,
                      marginBottom: 8,
                    }}
                  >
                    Backup & transfer
                  </div>
                  <div
                    style={{
                      color: S.dim,
                      fontSize: 13,
                      lineHeight: 1.5,
                      marginBottom: 10,
                    }}
                  >
                    Data is saved per browser or app copy. To move your
                    merchants to another device — or from Safari into the
                    home-screen app — tap Copy backup here, then paste it into
                    the Import box on the other side.
                  </div>
                  <button
                    onClick={() =>
                      copy(JSON.stringify({ merchants, history }), "backup")
                    }
                    style={{
                      width: "100%",
                      padding: "13px 0",
                      borderRadius: 10,
                      border: `1px solid ${S.accent}`,
                      background: "transparent",
                      color: S.accent,
                      fontSize: 14,
                      fontWeight: 700,
                      cursor: "pointer",
                    }}
                  >
                    {copied === "backup"
                      ? "Backup copied ✓ — now paste it on the other device"
                      : "Copy backup"}
                  </button>
                  <label
                    style={{
                      display: "block",
                      width: "100%",
                      boxSizing: "border-box",
                      marginTop: 10,
                      padding: "13px 0",
                      borderRadius: 10,
                      border: "none",
                      background: S.accent,
                      color: "#fff",
                      fontSize: 14,
                      fontWeight: 700,
                      cursor: "pointer",
                      textAlign: "center",
                    }}
                  >
                    Import from file
                    <input
                      type="file"
                      style={{ display: "none" }}
                      onChange={(e) => {
                        const f = e.target.files && e.target.files[0];
                        if (!f) return;
                        const r = new FileReader();
                        r.onload = () => importBackup(String(r.result));
                        r.readAsText(f);
                        e.target.value = "";
                      }}
                    />
                  </label>
                  <div
                    style={{
                      color: S.dim,
                      fontSize: 12,
                      textAlign: "center",
                      margin: "10px 0 2px",
                    }}
                  >
                    or paste a backup below
                  </div>
                  <textarea
                    style={{
                      ...inputStyle,
                      minHeight: 56,
                      resize: "vertical",
                      marginTop: 6,
                    }}
                    value={importText}
                    onChange={(e) => setImportText(e.target.value)}
                    placeholder="Paste a backup here to import…"
                    autoCorrect="off"
                    autoCapitalize="off"
                    spellCheck={false}
                  />
                  <button
                    onClick={importBackup}
                    style={{
                      width: "100%",
                      marginTop: 8,
                      padding: "13px 0",
                      borderRadius: 10,
                      border: "none",
                      background: importText.trim() ? S.accent : S.line,
                      color: importText.trim() ? "#fff" : S.dim,
                      fontSize: 14,
                      fontWeight: 700,
                      cursor: importText.trim() ? "pointer" : "default",
                    }}
                  >
                    Import backup
                  </button>
                  {importMsg && (
                    <div style={{ color: S.teal, fontSize: 13, marginTop: 8 }}>
                      {importMsg}
                    </div>
                  )}
                </div>
              </React.Fragment>
            )}
          </div>
        )}

        {loaded && tab === "history" && (
          <div>
            {history.length === 0 && (
              <div
                style={{
                  color: S.dim,
                  textAlign: "center",
                  padding: "40px 20px",
                  lineHeight: 1.5,
                }}
              >
                No tickets yet. Tap "Mark as processed" on a new ticket and
                it will be saved here.
              </div>
            )}
            {history.map((t) => (
              <div
                key={t.id}
                style={{
                  background: S.panel,
                  border: `1px solid ${S.line}`,
                  borderRadius: 14,
                  padding: "14px 16px",
                  marginBottom: 10,
                }}
              >
                <div style={{ fontSize: 12, color: S.dim, marginBottom: 4 }}>
                  {new Date(t.at).toLocaleString("en-AU", {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                    year: "numeric",
                    hour: "numeric",
                    minute: "2-digit",
                  })}
                  {" · "}
                  {t.type}
                </div>
                <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 10 }}>
                  {t.subject}
                </div>
                {expandedId === t.id && (
                  <div
                    style={{
                      background: S.panel2,
                      borderRadius: 10,
                      padding: "12px 14px",
                      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                      fontSize: 12.5,
                      lineHeight: 1.55,
                      whiteSpace: "pre-wrap",
                      marginBottom: 10,
                      color: S.ink,
                    }}
                  >
                    {t.body}
                  </div>
                )}
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button
                    onClick={() =>
                      setExpandedId(expandedId === t.id ? null : t.id)
                    }
                    style={smallBtn(S.line)}
                  >
                    {expandedId === t.id ? "Hide" : "View"}
                  </button>
                  <button
                    onClick={() => copy(t.body, "hist-" + t.id)}
                    style={smallBtn(S.accent, true)}
                  >
                    {copied === "hist-" + t.id ? "Copied ✓" : "Copy body"}
                  </button>
                  {confirmDeleteTicket === t.id ? (
                    <button
                      onClick={() => deleteTicket(t.id)}
                      style={smallBtn(S.danger, true)}
                    >
                      Confirm delete
                    </button>
                  ) : (
                    <button
                      onClick={() => setConfirmDeleteTicket(t.id)}
                      style={smallBtn(S.line)}
                    >
                      Delete
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}

        {loaded && tab === "ticket" && (
          <div>
            {merchants.length === 0 ? (
              <div
                style={{
                  color: S.dim,
                  textAlign: "center",
                  padding: "40px 20px",
                  lineHeight: 1.5,
                }}
              >
                Add a merchant first — go to the Merchants tab.
              </div>
            ) : (
              <React.Fragment>
                <Field
                  label={
                    selectedIds.length > 1
                      ? `Merchants (${selectedIds.length} selected — one ticket)`
                      : "Merchant"
                  }
                >
                  <div>
                    {selectedMerchants.length > 0 && (
                      <div
                        style={{
                          display: "flex",
                          flexWrap: "wrap",
                          gap: 8,
                          marginBottom: 10,
                        }}
                      >
                        {selectedMerchants.map((mm) => (
                          <button
                            key={mm.id}
                            onClick={() => toggleMerchant(mm.id)}
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: 8,
                              padding: "9px 14px",
                              borderRadius: 999,
                              border: `1px solid ${S.accent}`,
                              background: "rgba(79,77,220,0.10)",
                              color: S.accent,
                              fontSize: 14,
                              fontWeight: 600,
                              cursor: "pointer",
                            }}
                          >
                            {mm.name}
                            <span style={{ fontWeight: 800, fontSize: 16 }}>×</span>
                          </button>
                        ))}
                      </div>
                    )}
                    <input
                      style={inputStyle}
                      value={merchantQuery}
                      onChange={(e) => setMerchantQuery(e.target.value)}
                      placeholder={`Search ${merchants.length} merchants by name or MID…`}
                    />
                    {mq !== "" && (
                      <div style={{ marginTop: 8 }}>
                        {merchantResults.map((mm) => (
                          <button
                            key={mm.id}
                            onClick={() => toggleMerchant(mm.id)}
                            style={{
                              display: "flex",
                              width: "100%",
                              boxSizing: "border-box",
                              alignItems: "center",
                              gap: 10,
                              textAlign: "left",
                              padding: "12px 14px",
                              marginBottom: 8,
                              borderRadius: 10,
                              border: `1px solid ${S.line}`,
                              background: S.panel,
                              color: S.ink,
                              fontSize: 15,
                              cursor: "pointer",
                            }}
                          >
                            <span
                              style={{
                                color: S.accent,
                                fontWeight: 800,
                                fontSize: 18,
                                lineHeight: 1,
                              }}
                            >
                              +
                            </span>
                            <span style={{ flex: 1 }}>{mm.name}</span>
                            <span style={{ color: S.dim, fontSize: 13 }}>
                              MID {mm.mid}
                            </span>
                          </button>
                        ))}
                        {merchantResults.length === 0 && (
                          <div style={{ color: S.dim, fontSize: 13, padding: "6px 2px" }}>
                            No merchants match "{merchantQuery}". Check the
                            Merchants tab to add them.
                          </div>
                        )}
                      </div>
                    )}
                    <div style={{ color: S.dim, fontSize: 12, marginTop: 8 }}>
                      Add more than one merchant to raise a single ticket for
                      multiple sites (e.g. same owner).
                    </div>
                  </div>
                </Field>

                <Field label="Ticket type">
                  <Pills
                    options={TICKET_TYPES}
                    value={ticketType}
                    onChange={setTicketType}
                  />
                </Field>

                {ticketType === "Machine allocation" && (
                  <React.Fragment>
                    <Field label="Machine">
                      <Pills options={MACHINES} value={machine} onChange={setMachine} />
                    </Field>

                    <Field label="Number of terminals">
                      <Stepper value={qty} onChange={setQty} />
                    </Field>

                    <Field label="Mode">
                      {machine === "DX8000" ? (
                        <div style={{ color: S.dim, fontSize: 14 }}>
                          DX8000 is automatically standalone mode
                        </div>
                      ) : machine === "P400" ? (
                        <div style={{ color: S.dim, fontSize: 14 }}>
                          P400 is always integrated
                        </div>
                      ) : (
                        <div>
                          <Pills
                            options={["Standalone Mode", "Integrated"]}
                            value={mode}
                            onChange={setMode}
                          />
                          {selected && selected.integrated && (
                            <div
                              style={{
                                color: S.dim,
                                fontSize: 13,
                                marginTop: 8,
                                lineHeight: 1.4,
                              }}
                            >
                              This merchant has integration on their account —
                              pick the right mode for this terminal.
                            </div>
                          )}
                        </div>
                      )}
                    </Field>

                {effectiveMode === "Integrated" && (
                  <div style={{ borderLeft: `2px solid ${S.accent}`, paddingLeft: 14 }}>
                    {selected && !selected.integrated && (
                      <div
                        style={{
                          color: S.orange,
                          fontSize: 13,
                          marginBottom: 12,
                          lineHeight: 1.4,
                        }}
                      >
                        This merchant has no integration details saved — the email
                        will show placeholders. Edit the merchant to add POS name
                        and contact.
                      </div>
                    )}
                    <Field label="Requested integration day">
                      <input
                        style={inputStyle}
                        value={integrationDay}
                        onChange={(e) => setIntegrationDay(e.target.value)}
                        placeholder="e.g. Wednesday 9 July"
                      />
                    </Field>
                        <Field label="Booking slot">
                          <Pills
                            options={["Morning", "Afternoon"]}
                            value={integrationSlot}
                            onChange={setIntegrationSlot}
                          />
                        </Field>
                      </div>
                    )}
                  </React.Fragment>
                )}

                {ticketType === "Change rates" && (
                  <React.Fragment>
                    <Field label="Plan">
                      <Pills
                        options={["Black Plan", "Gold Plan", "Custom Rate"]}
                        value={plan}
                        onChange={setPlan}
                      />
                    </Field>
                    {plan === "Black Plan" && (
                      <div style={{ color: S.dim, fontSize: 13, margin: "-6px 0 14px" }}>
                        2.49% Visa, MasterCard, Debit & AMEX · Earn: 1
                        Qantas Point per $1
                      </div>
                    )}
                    {plan === "Gold Plan" && (
                      <div style={{ color: S.dim, fontSize: 13, margin: "-6px 0 14px" }}>
                        1.89% Visa, MasterCard & Debit · 2.1% AMEX · Earn:
                        1 Qantas Point per $2
                      </div>
                    )}
                    {plan === "Custom Rate" && (
                      <div style={{ borderLeft: `2px solid ${S.accent}`, paddingLeft: 14 }}>
                        <Field label="Visa & MasterCard %">
                          <input
                            style={inputStyle}
                            value={customVisa}
                            onChange={(e) => setCustomVisa(e.target.value)}
                            placeholder="e.g. 1.75"
                            inputMode="decimal"
                          />
                        </Field>
                        <Field label="Debit %">
                          <input
                            style={inputStyle}
                            value={customDebit}
                            onChange={(e) => setCustomDebit(e.target.value)}
                            placeholder="e.g. 0.95"
                            inputMode="decimal"
                          />
                        </Field>
                        <Field label="AMEX %">
                          <input
                            style={inputStyle}
                            value={customAmex}
                            onChange={(e) => setCustomAmex(e.target.value)}
                            placeholder="e.g. 2.2"
                            inputMode="decimal"
                          />
                        </Field>
                      </div>
                    )}
                    {plan === "Custom Rate" && (
                    <Field label="Qantas Points earn rate">
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span style={{ color: S.dim, fontSize: 14, whiteSpace: "nowrap" }}>
                          1 point per $
                        </span>
                        <input
                          style={{ ...inputStyle, maxWidth: 110 }}
                          value={earnRate}
                          onChange={(e) => setEarnRate(e.target.value)}
                          placeholder="3 – 50"
                          inputMode="decimal"
                        />
                        <span style={{ color: S.dim, fontSize: 14 }}>earned</span>
                      </div>
                    </Field>
                    )}
                  </React.Fragment>
                )}

                {ticketType === "Order paper rolls" && (
                  <Field label="Packs of paper rolls">
                    <Stepper value={qty} onChange={setQty} max={120} />
                  </Field>
                )}

                {ticketType === "Enable refunds" && (
                  <React.Fragment>
                    <Field label="Refund amount ($)">
                      <input
                        style={inputStyle}
                        value={refundAmount}
                        onChange={(e) => setRefundAmount(e.target.value)}
                        placeholder="e.g. 500"
                        inputMode="decimal"
                      />
                    </Field>
                    <Field label="Refund limit per day ($)">
                      <input
                        style={inputStyle}
                        value={refundLimit}
                        onChange={(e) => setRefundLimit(e.target.value)}
                        placeholder="e.g. 1000"
                        inputMode="decimal"
                      />
                    </Field>
                  </React.Fragment>
                )}

                <Field label="Extra notes (optional)">
                  <textarea
                    style={{ ...inputStyle, minHeight: 56, resize: "vertical" }}
                    value={extraNotes}
                    onChange={(e) => setExtraNotes(e.target.value)}
                    placeholder="Anything else for the support team"
                  />
                </Field>

                {email && (
                  <div style={{ marginTop: 24 }}>
                    <div
                      style={{
                        fontSize: 11,
                        letterSpacing: "0.08em",
                        textTransform: "uppercase",
                        color: S.dim,
                        fontWeight: 600,
                        marginBottom: 8,
                      }}
                    >
                      Email preview
                    </div>
                    <div
                      style={{
                        background: S.paper,
                        color: S.paperInk,
                        borderRadius: 14,
                        padding: "16px 18px",
                        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                        fontSize: 13,
                        lineHeight: 1.55,
                        boxShadow: "0 6px 20px rgba(35,38,43,0.10)", border: `1px solid ${S.line}`,
                      }}
                    >
                      <div
                        style={{
                          paddingBottom: 10,
                          marginBottom: 10,
                          borderBottom: "1px dashed #C9C5B8",
                          fontWeight: 700,
                        }}
                      >
                        {email.subject}
                      </div>
                      <div style={{ whiteSpace: "pre-wrap" }}>{email.body}</div>
                    </div>
                    <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                      <button
                        onClick={() => copy(email.subject, "subject")}
                        style={{
                          flex: 1,
                          padding: "13px 0",
                          borderRadius: 10,
                          border: `1px solid ${S.line}`,
                          background: S.panel2,
                          color: copied === "subject" ? S.green : S.ink,
                          fontSize: 14,
                          fontWeight: 600,
                          cursor: "pointer",
                        }}
                      >
                        {copied === "subject" ? "Copied ✓" : "Copy subject"}
                      </button>
                      <button
                        onClick={() => copy(email.body, "body")}
                        style={{
                          flex: 1.4,
                          padding: "13px 0",
                          borderRadius: 10,
                          border: "none",
                          background: copied === "body" ? S.green : S.accent,
                          color: "#fff",
                          fontSize: 14,
                          fontWeight: 700,
                          cursor: "pointer",
                        }}
                      >
                        {copied === "body" ? "Copied ✓" : "Copy email body"}
                      </button>
                    </div>
                    <button
                      onClick={logTicket}
                      style={{
                        width: "100%",
                        marginTop: 10,
                        padding: "13px 0",
                        borderRadius: 10,
                        border: alreadyProcessed
                          ? "none"
                          : `1px solid ${S.teal}`,
                        background: alreadyProcessed ? S.teal : "transparent",
                        color: alreadyProcessed ? "#fff" : S.teal,
                        fontSize: 14,
                        fontWeight: 700,
                        cursor: "pointer",
                      }}
                    >
                      {alreadyProcessed
                        ? "Processed ✓ — saved to history"
                        : "Mark as processed"}
                    </button>
                  </div>
                )}
              </React.Fragment>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
